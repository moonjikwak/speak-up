<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak Up! · 통일초등학교 영어 스피킹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2d2b4e; --ink-soft:#6b6890;
    --card:#ffffff; --paper:#fef7e6;
    --mint:#54d6a3; --sky:#2ba7e0; --coral:#ff7a4d; --grape:#9b7bff;
    --shadow:0 18px 40px rgba(45,43,78,.16);
    --shadow-sm:0 8px 18px rgba(45,43,78,.12);
    --accent:var(--mint); --accent-soft:rgba(84,214,163,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(circle at 12% 14%, rgba(255,206,61,.32), transparent 40%),
      radial-gradient(circle at 88% 10%, rgba(94,201,245,.36), transparent 44%),
      radial-gradient(circle at 80% 90%, rgba(84,214,163,.30), transparent 42%),
      radial-gradient(circle at 16% 92%, rgba(155,123,255,.26), transparent 40%),
      #fef7e6;
    display:flex;flex-direction:column;align-items:center;padding:20px 16px 44px;overflow-x:hidden;
  }
  .app{position:relative;z-index:2;width:100%;max-width:580px;display:flex;flex-direction:column;gap:18px;}

  /* header */
  header{display:flex;align-items:flex-start;gap:13px;padding:2px 4px;}
  .mascot{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:36px;
    background:linear-gradient(160deg,#ffce3d,#ffb017);box-shadow:var(--shadow-sm);animation:bob 3.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}
  .title .school{display:inline-block;font-weight:900;font-size:.72rem;color:#fff;background:var(--accent);
    padding:3px 10px;border-radius:999px;margin-bottom:5px;box-shadow:var(--shadow-sm);letter-spacing:.2px;}
  .title h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:-.5px;}
  .title h1 .kor{font-family:'Nunito',sans-serif;font-weight:900;}
  .title h1 span#brand{color:var(--accent);}
  .title p{font-weight:800;color:var(--ink-soft);font-size:.86rem;margin-top:4px;}
  .score-pill{margin-left:auto;background:#fff;border-radius:999px;padding:9px 14px;font-family:'Fredoka',sans-serif;
    font-weight:600;font-size:1rem;color:#ffb017;box-shadow:var(--shadow-sm);align-self:center;}

  /* home grade cards */
  .home-intro{font-weight:800;color:var(--ink-soft);text-align:center;font-size:1rem;margin-top:6px;}
  .grades{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .gcard{border:none;cursor:pointer;text-align:left;border-radius:26px;padding:20px 18px;color:#fff;
    box-shadow:var(--shadow);transition:transform .15s;font-family:'Nunito',sans-serif;position:relative;overflow:hidden;}
  .gcard:hover{transform:translateY(-4px) rotate(-1deg);}
  .gcard .gemoji{font-size:42px;display:block;}
  .gcard .gnum{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;margin-top:8px;}
  .gcard .gtopic{font-weight:800;font-size:.92rem;opacity:.95;margin-top:2px;}
  .gcard .soon{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.28);font-weight:900;
    font-size:.66rem;padding:3px 8px;border-radius:999px;z-index:2;}
  .gcard::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16);right:-40px;bottom:-50px;}
  .g3{background:linear-gradient(150deg,#54d6a3,#1fb27a);}
  .g4{background:linear-gradient(150deg,#5ec9f5,#2287d8);}
  .g5{background:linear-gradient(150deg,#ff9a5a,#ff6a3d);}
  .g6{background:linear-gradient(150deg,#b08bff,#7a52e8);}

  /* generic card */
  .card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);position:relative;overflow:hidden;}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .back{border:none;cursor:pointer;background:#fff;color:var(--ink);font-weight:800;font-size:.9rem;
    padding:9px 14px;border-radius:14px;box-shadow:var(--shadow-sm);font-family:'Nunito',sans-serif;}
  .crumb{font-weight:900;color:var(--ink-soft);font-size:.9rem;}
  .tabs{display:flex;gap:8px;margin-left:auto;}
  .tab{border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;
    padding:9px 16px;border-radius:14px;background:#fff;color:var(--ink-soft);box-shadow:var(--shadow-sm);}
  .tab.active{background:var(--accent);color:#fff;}

  /* lesson list */
  .lessons{display:flex;flex-direction:column;gap:11px;}
  .lcard{border:none;cursor:pointer;text-align:left;background:#fff;border-radius:20px;padding:14px 16px;
    box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;font-family:'Nunito',sans-serif;
    transition:transform .14s, box-shadow .14s;position:relative;overflow:hidden;border-left:7px solid var(--accent);}
  .lcard:hover{transform:translateX(4px);box-shadow:var(--shadow);}
  .lcard .lnum{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;}
  .lcard .lemoji{font-size:30px;flex:none;}
  .lcard .ltext{flex:1;min-width:0;}
  .lcard .lt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.1;color:var(--ink);}
  .lcard .lk{font-weight:800;color:var(--ink-soft);font-size:.82rem;margin-top:2px;}
  .lcard .larrow{color:var(--accent);font-weight:900;font-size:1.2rem;flex:none;}
  .empty-note{background:#fff;border-radius:24px;padding:34px 22px;text-align:center;box-shadow:var(--shadow);}
  .empty-note .ee{font-size:48px;}
  .empty-note .et{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.3rem;margin-top:8px;}
  .empty-note .ed{font-weight:800;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  /* practice */
  .pcard{padding:26px 22px 24px;display:flex;flex-direction:column;gap:14px;min-height:300px;}
  .pcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0%, var(--accent-soft), transparent 50%);pointer-events:none;}
  .bigemoji{font-size:64px;text-align:center;line-height:1;filter:drop-shadow(0 6px 8px rgba(45,43,78,.18));}
  .sentence{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.95rem;line-height:1.18;letter-spacing:-.5px;text-align:center;}
  .sentence .w{border-radius:6px;padding:0 2px;transition:color .2s;}
  .sentence .w.hit{color:var(--mint);} .sentence .w.miss{color:#ff5a47;}
  .ko{font-weight:800;color:var(--ink-soft);font-size:1.02rem;text-align:center;}
  .feedback{min-height:50px;display:flex;flex-direction:column;gap:6px;justify-content:center;text-align:center;}
  .stars{font-size:1.7rem;letter-spacing:4px;height:28px;}
  .fb-msg{font-weight:800;font-size:.98rem;}
  .heard{font-weight:700;color:var(--ink-soft);font-size:.9rem;}
  .heard b{color:var(--ink);}

  .controls{display:flex;gap:10px;}
  .btn{border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;border-radius:18px;
    padding:15px 8px;font-size:1.04rem;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;flex:1;
    box-shadow:var(--shadow-sm);transition:transform .12s,filter .2s;}
  .btn:hover{transform:translateY(-3px);filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none;}
  .btn .ico{font-size:1.2rem;}
  .btn-listen{background:linear-gradient(160deg,#5ec9f5,#2287d8);}
  .btn-speak{background:linear-gradient(160deg,#ff7a6b,#ff5a47);}
  .btn-replay{background:linear-gradient(160deg,#a98bff,#7a52e8);}
  .btn-speak.rec{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,71,.5);}50%{box-shadow:0 0 0 13px rgba(255,90,71,0);}}

  .footer{display:flex;align-items:center;gap:12px;}
  .progress{flex:1;height:13px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(45,43,78,.12);}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffce3d,#ffb017);transition:width .4s;}
  .next{border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;background:var(--ink);
    color:#fff;padding:11px 18px;border-radius:15px;box-shadow:var(--shadow-sm);white-space:nowrap;transition:opacity .2s;}
  .next.locked{opacity:.4;}
  @keyframes nudge{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
  .btn-speak.nudge{animation:nudge .5s;}

  /* dialog / roleplay */
  .dlg-head{padding:18px 20px;display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--accent),rgba(0,0,0,.05));color:#fff;}
  .dlg-head .dh-emoji{font-size:30px;}
  .dlg-head .dh-t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;}
  .dlg-head .dh-s{font-weight:800;font-size:.82rem;opacity:.92;}
  .chat{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow-y:auto;}
  .bubble{max-width:82%;padding:12px 15px;border-radius:18px;font-weight:700;animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .bubble .be{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.1rem;}
  .bubble .bk{font-size:.84rem;color:var(--ink-soft);margin-top:3px;font-weight:700;}
  .b-npc{align-self:flex-start;background:#f0eefb;border-bottom-left-radius:5px;}
  .b-npc .who{font-size:.74rem;font-weight:900;color:var(--accent);margin-bottom:3px;}
  .b-you{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px;}
  .b-you .bk{color:rgba(255,255,255,.85);}
  .dlg-prompt{padding:16px 18px;border-top:2px dashed #eee5cf;display:flex;flex-direction:column;gap:10px;}
  .dlg-prompt .label{font-weight:800;color:var(--ink-soft);font-size:.86rem;}
  .dlg-prompt .myline{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.25rem;}
  .dlg-prompt .myline .blank{color:var(--coral);border-bottom:3px dotted var(--coral);padding:0 14px;}
  .dlg-prompt .myko{font-weight:800;color:var(--ink-soft);font-size:.9rem;}
  .dlg-actions{display:flex;gap:10px;}
  .ghost{border:2px solid #e7e2d4;background:#fff;color:var(--ink-soft);cursor:pointer;font-family:'Nunito',sans-serif;
    font-weight:800;padding:13px 14px;border-radius:16px;font-size:.92rem;}
  .done-box{padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;}
  .done-box .de{font-size:54px;}
  .done-box .dt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.5rem;}
  .done-box .dd{font-weight:800;color:var(--ink-soft);}

  .note{font-size:.8rem;color:var(--ink-soft);font-weight:700;text-align:center;line-height:1.5;padding:0 8px;}
  .note b{color:var(--coral);}
  .hidden{display:none!important;}

  /* clouds + confetti */
  .cloud{position:fixed;background:rgba(255,255,255,.5);border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0;animation:drift 24s linear infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
  .c1{width:90px;height:34px;top:12%;left:-120px;}.c1::before{width:46px;height:46px;top:-22px;left:14px;}.c1::after{width:34px;height:34px;top:-14px;left:50px;}
  .c2{width:66px;height:25px;top:64%;left:-120px;animation-duration:32s;animation-delay:-9s;opacity:.7;}.c2::before{width:34px;height:34px;top:-17px;left:10px;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(116vw);}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
  @media(max-width:430px){.sentence{font-size:1.6rem;}.grades{gap:11px;}}
</style>
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <canvas id="confetti"></canvas>

  <div class="app">
    <header>
      <div class="mascot" id="mascot" style="display:none">🦉</div>
      <div class="title">
        <span class="school">🏫 통일초등학교</span>
        <h1>Speak <span id="brand">Up!</span></h1>
        <p id="subtitle"></p>
      </div>
      <div class="score-pill">⭐ <span id="totalStars">0</span></div>
    </header>

    <!-- HOME -->
    <section id="home">
      <p class="home-intro">우리 학년·단원을 골라 따라 말하고, 마지막엔 부엉이와 대화에 도전해요! 🎤</p>
      <div class="grades" id="gradeGrid"></div>
      <p class="note" id="homeNote"></p>
    </section>

    <!-- LESSON LIST -->
    <section id="lessonList" class="hidden">
      <div class="topbar">
        <button class="back" id="backHome">← 학년 선택</button>
        <span class="crumb" id="listCrumb"></span>
      </div>
      <div class="lessons" id="lessonGrid"></div>
      <div class="empty-note hidden" id="emptyNote">
        <div class="ee">🛠️</div>
        <div class="et">곧 만나요!</div>
        <div class="ed">이 학년은 지금 준비하고 있어요.<br>3학년부터 먼저 연습해 볼까요?</div>
      </div>
    </section>

    <!-- LESSON (practice + dialog) -->
    <section id="lesson" class="hidden">
      <div class="topbar">
        <button class="back" id="backList">← 단원 선택</button>
        <span class="crumb" id="lessonCrumb"></span>
        <div class="tabs">
          <button class="tab active" id="tabPractice">🗣️ 따라 말하기</button>
          <button class="tab" id="tabDialog">💬 대화 도전</button>
        </div>
      </div>

      <!-- PRACTICE -->
      <div id="practice" class="card pcard">
        <div class="bigemoji" id="bigEmoji">👋</div>
        <div class="sentence" id="sentence"></div>
        <div class="ko" id="ko"></div>
        <div class="feedback">
          <div class="stars" id="stars"></div>
          <div class="fb-msg" id="fbMsg">🔊 듣기 → 🎤 말하기 순서로 연습해요!</div>
          <div class="heard" id="heard"></div>
        </div>
        <div class="controls">
          <button class="btn btn-listen" id="listenBtn"><span class="ico">🔊</span> 듣기</button>
          <button class="btn btn-speak" id="speakBtn"><span class="ico">🎤</span> 말하기</button>
          <button class="btn btn-replay" id="replayBtn" disabled><span class="ico">🔁</span> 내 목소리</button>
        </div>
      </div>
      <div class="footer" id="pFooter">
        <div class="progress"><i id="bar"></i></div>
        <button class="next" id="nextBtn">다음 →</button>
      </div>

      <!-- DIALOG -->
      <div id="dialog" class="card hidden">
        <div class="dlg-head"><span class="dh-emoji" id="dhEmoji">💬</span>
          <div><div class="dh-t" id="dhTitle"></div><div class="dh-s">연습한 문장으로 부엉이와 대화해 봐요!</div></div>
        </div>
        <div class="chat" id="chat"></div>
        <div class="dlg-prompt hidden" id="dlgPrompt">
          <div class="label">🙋 내 차례예요 — 따라 말해 보세요</div>
          <div class="myline" id="myLine"></div>
          <div class="myko" id="myKo"></div>
          <div class="dlg-actions">
            <button class="btn btn-listen" id="dListenBtn" style="flex:1"><span class="ico">🔊</span> 듣기</button>
            <button class="btn btn-speak" id="dSpeakBtn" style="flex:2"><span class="ico">🎤</span> 말하기</button>
            <button class="ghost" id="dSkipBtn">건너뛰기 →</button>
          </div>
        </div>
        <div class="done-box hidden" id="doneBox">
          <div class="de">🎉</div>
          <div class="dt">대화 완성!</div>
          <div class="dd">연습한 문장으로 멋지게 대화했어요!</div>
          <div class="dlg-actions" style="justify-content:center">
            <button class="next" id="restartDlg">다시 하기 🔄</button>
          </div>
        </div>
      </div>

      <p class="note" id="lessonNote"></p>
    </section>
  </div>

<script>
/* =====================================================================
   통일 Speak Up!  —  학년 → 단원 → (따라 말하기 / 대화 도전)
   콘텐츠 출처: YBM 초등영어 3 (최희경) 교과서 대화문·어휘·연간 지도 계획
   역할극 상대는 학교 마스코트 "부엉이"(Hoo)
   ===================================================================== */

const OWL = "🦉";  // 우리 마스코트

const GRADES = {
  3:{ accent:"#1fb27a", accentSoft:"rgba(84,214,163,.16)", emoji:"🐣", topic:"기초 회화",
    lessons:[
      /* ---------- Lesson 1 ---------- */
      { num:1, title:"Hello, ABC!", emoji:"👋", hint:"인사하고 이름 말하기",
        sentences:[
          {e:"👋", en:"Hello!", ko:"안녕!"},
          {e:"🙋", en:"Hi! I'm Leo.", ko:"안녕! 나는 레오야."},
          {e:"😊", en:"My name is Hana.", ko:"내 이름은 하나야."},
          {e:"🙌", en:"Hi, everyone!", ko:"안녕, 모두들!"},
          {e:"🗣️", en:"Hello, everyone!", ko:"안녕하세요, 모두들!"},
          {e:"🙏", en:"Thank you.", ko:"고마워."},
          {e:"🌟", en:"Great!", ko:"훌륭해!"},
          {e:"👋", en:"Goodbye!", ko:"잘 가!"}],
        dialog:{ scene:"새 친구와 인사하기", emoji:"🙋",
          turns:[
            {who:"npc", en:"Hello, everyone!", ko:"안녕, 모두들!"},
            {who:"you", en:"Hello!", ko:"안녕!", model:"Hello."},
            {who:"npc", en:"My name is Hoo.", ko:"내 이름은 후야."},
            {who:"you", en:"My name is ___.", ko:"내 이름은 ___야.", model:"My name is Mina."},
            {who:"npc", en:"Great!", ko:"훌륭해!"},
            {who:"you", en:"Thank you!", ko:"고마워!", model:"Thank you."},
            {who:"npc", en:"Goodbye!", ko:"잘 가!"},
            {who:"you", en:"Goodbye!", ko:"잘 가!", model:"Goodbye."}]}},

      /* ---------- Lesson 2 ---------- */
      { num:2, title:"What's This?", emoji:"🎒", hint:"무엇인지 묻고 답하기",
        sentences:[
          {e:"❓", en:"What's this?", ko:"이것은 무엇이니?"},
          {e:"🎒", en:"It's a bag.", ko:"그것은 가방이야."},
          {e:"⚽", en:"It's a ball.", ko:"그것은 공이야."},
          {e:"🪑", en:"It's a chair.", ko:"그것은 의자야."},
          {e:"🚗", en:"It's a car.", ko:"그것은 자동차야."},
          {e:"🕐", en:"It's a clock.", ko:"그것은 시계야."},
          {e:"🐘", en:"It's big.", ko:"그것은 커."},
          {e:"🐜", en:"It's small.", ko:"그것은 작아."},
          {e:"❓", en:"What's that?", ko:"저것은 무엇이니?"}],
        dialog:{ scene:"물건 알아맞히기", emoji:"🔍",
          turns:[
            {who:"npc", en:"Look! What's this?", ko:"봐! 이것은 무엇이니?"},
            {who:"you", en:"It's a ___.", ko:"그것은 ___야.", model:"It's a ball."},
            {who:"npc", en:"What's that?", ko:"저것은 무엇이니?"},
            {who:"you", en:"It's a ___.", ko:"그것은 ___야.", model:"It's a car."},
            {who:"npc", en:"Wow! It's big!", ko:"우와! 그것은 크다!"},
            {who:"you", en:"Yes! It's big.", ko:"응! 그것은 커.", model:"It's big."},
            {who:"npc", en:"What's this?", ko:"이것은 무엇이니?"},
            {who:"you", en:"It's a doll. It's small.", ko:"그것은 인형이야. 작아.", model:"It's a doll."}]}},

      /* ---------- Lesson 3 ---------- */

/* ================= 상태 ================= */
const $=id=>document.getElementById(id);
let gradeKey=null, GD=null, lessonIdx=0, data=null, idx=0, totalStars=0;
let recordings={};            // {idx: blobURL}
let spoken=false;             // 현재 문장을 따라 말했는지(말하기 시도 여부)
let dPos=0, dlg=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ================= TTS ================= */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/female|samantha|zira|google/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null;}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
// 관사 a/an 은 강세가 없어 약하게(schwa) 발음돼 잘 안 들림.
// 관사 '앞'에 아주 짧은 쉼을 넣으면, 강세는 뒤 명사에 실리고 a는 약하게 유지되면서도 또렷하게 들림.
// (a '뒤'에 쉼을 넣으면 a가 구절 끝에 와서 너무 강하게 발음됨)
function ttsTune(t){ return t.replace(/ (an?)\b/gi,', $1'); }
function speak(text,cb){
  if(!('speechSynthesis'in window)){cb&&cb();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(ttsTune(text));
  u.lang="en-US";u.rate=.8;u.pitch=1.05;if(voice)u.voice=voice;
  $("mascot").textContent="🎵";
  u.onend=()=>{$("mascot").textContent=OWL;cb&&cb();};
  speechSynthesis.speak(u);
}

/* ================= 마이크: 인식 + 녹음 ================= */
let recog=null, recording=false, mediaRec=null, chunks=[], micStream=null, onResultCb=null;
async function ensureMic(){ if(micStream)return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:true}); return micStream; }
function setupRecog(){ if(!SR)return false; recog=new SR();
  recog.lang="en-US";recog.interimResults=false;recog.maxAlternatives=3;
  recog.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript);onResultCb&&onResultCb(alts);};
  recog.onerror=e=>{stopRecUI();handleErr(e.error);};
  recog.onend=()=>{stopMedia();stopRecUI();};
  return true; }
function handleErr(err){
  const t=err==="not-allowed"||err==="service-not-allowed"?"🎤 마이크 사용을 허용해 주세요!"
    :err==="no-speech"?"잘 못 들었어요. 한 번 더 말해 볼까요? 🙂":"다시 한 번 눌러서 말해 보세요!";
  setFB(t);
}
function stopRecUI(){recording=false;
  $("speakBtn").classList.remove("rec");$("speakBtn").innerHTML='<span class="ico">🎤</span> 말하기';
  $("dSpeakBtn").classList.remove("rec");$("dSpeakBtn").innerHTML='<span class="ico">🎤</span> 말하기';}
function stopMedia(){ if(mediaRec&&mediaRec.state!=="inactive"){try{mediaRec.stop();}catch(e){}} }

async function startListen(btn, recordKey, cb){
  if(!SR){setFB("이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 보세요! 🌐");return;}
  if(!recog)setupRecog();
  if(recording){try{recog.stop();}catch(e){}return;}
  onResultCb=cb;
  chunks=[];
  try{
    const stream=await ensureMic();
    mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};
    mediaRec.onstop=()=>{ if(recordKey!=null&&chunks.length){
      const url=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));
      recordings[recordKey]=url; $("replayBtn").disabled=false; } };
    mediaRec.start();
  }catch(e){ /* 녹음 불가해도 인식은 시도 */ }
  try{
    recog.start();recording=true;
    btn.classList.add("rec");btn.innerHTML='<span class="ico">●</span> 듣는 중…';
    setFB("지금 말해 보세요! 🎤");$("heard").textContent="";$("stars").textContent="";
    $("mascot").textContent="👂";
  }catch(e){stopRecUI();setFB("다시 한 번 눌러 주세요!");}
}

/* ================= 채점 ================= */
const norm=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
function gradePractice(alts){
  const s=data.sentences[idx], target=norm(s.en).split(" ");
  let best={score:-1,said:"",hits:[]};
  alts.forEach(raw=>{const said=norm(raw).split(" "),pool=said.slice();
    const hits=target.map(w=>{const k=pool.indexOf(w);if(k>=0){pool.splice(k,1);return true;}return false;});
    const score=hits.filter(Boolean).length/target.length;
    if(score>best.score)best={score,said:raw,hits};});
  $("sentence").querySelectorAll(".w").forEach((sp,i)=>{sp.classList.remove("hit","miss");sp.classList.add(best.hits[i]?"hit":"miss");});
  const stars=best.score>=.85?3:best.score>=.6?2:best.score>=.3?1:0;
  $("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("heard").innerHTML='내가 말한 것: <b>'+best.said+'</b>';
  let m;
  if(stars===3){m="완벽해요! 발음이 아주 좋아요! 🎉";totalStars+=3;burst();$("mascot").textContent="🥳";}
  else if(stars===2){m="아주 잘했어요! 거의 다 맞았어요! 👏";totalStars+=2;$("mascot").textContent="😄";}
  else if(stars===1){m="좋아요! 천천히 다시 따라 말해 볼까요? 💪";totalStars+=1;$("mascot").textContent="🙂";}
  else{m="괜찮아요! 🔊 듣기를 누르고 다시 도전해요! 🌱";}
  setFB(m);$("totalStars").textContent=totalStars;
  spoken=true;setNextLocked(false);
  setTimeout(()=>{if(!recording)$("mascot").textContent=OWL;},2500);
}
function setFB(t){$("fbMsg").textContent=t;}
// 따라 말하기 전에는 '다음'을 잠금. 마이크(SR) 미지원 환경에서는 잠그지 않음.
function setNextLocked(locked){
  const b=$("nextBtn");
  b.classList.toggle("locked",locked);
  b.innerHTML=locked?"다음 🔒":"다음 →";
}

/* ================= 화면 전환 ================= */
function setAccent(g){
  document.documentElement.style.setProperty('--accent',g.accent);
  document.documentElement.style.setProperty('--accent-soft',g.accentSoft);
}
function show(sec){ ["home","lessonList","lesson"].forEach(s=>$(s).classList.toggle("hidden",s!==sec)); }

function renderHome(){
  show("home");
  $("subtitle").textContent="";
  setAccent({accent:'#54d6a3',accentSoft:'rgba(84,214,163,.16)'});
  $("mascot").textContent=OWL;
  const grid=$("gradeGrid");grid.innerHTML="";
  [3,4,5,6].forEach(g=>{const G=GRADES[g];const ready=G.lessons.length>0;
    const label=ready?("기초 회화 · "+G.lessons.length+"단원"):"준비 중";
    const b=document.createElement("button");b.className="gcard g"+g;
    b.innerHTML=(ready?"":'<span class="soon">준비 중</span>')+
      `<span class="gemoji">${G.emoji}</span><div class="gnum">${g}학년</div><div class="gtopic">${label}</div>`;
    b.onclick=()=>openGrade(g);grid.appendChild(b);});
  $("homeNote").innerHTML=SR?"💡 마이크를 허용하면 발음 채점과 내 목소리 녹음이 돼요. <b>Chrome</b>을 추천해요!"
    :"💡 발음 채점·녹음은 <b>Chrome</b>에서 가장 잘 작동해요!";
}

function openGrade(g){
  gradeKey=g;GD=GRADES[g];setAccent(GD);
  $("subtitle").textContent=g+"학년";
  $("listCrumb").textContent=g+"학년 · 단원을 골라요";
  show("lessonList");
  const grid=$("lessonGrid");grid.innerHTML="";
  const empty=GD.lessons.length===0;
  $("emptyNote").classList.toggle("hidden",!empty);
  grid.classList.toggle("hidden",empty);
  $("mascot").textContent=OWL;
  GD.lessons.forEach((L,i)=>{
    const b=document.createElement("button");b.className="lcard";
    b.innerHTML=`<span class="lnum">${L.num}</span><span class="lemoji">${L.emoji}</span>
      <span class="ltext"><span class="lt">${L.title}</span><span class="lk">${L.hint}</span></span>
      <span class="larrow">→</span>`;
    b.onclick=()=>openLesson(i);grid.appendChild(b);
  });
}

function openLesson(i){
  lessonIdx=i;data=GD.lessons[i];idx=0;recordings={};
  $("subtitle").textContent=gradeKey+"학년 · Lesson "+data.num;
  $("lessonCrumb").textContent="Lesson "+data.num+" · "+data.title;
  show("lesson");
  showTab("practice");renderPractice();
  $("dhTitle").textContent=data.dialog.scene;$("dhEmoji").textContent=data.dialog.emoji;
  $("lessonNote").innerHTML="💡 문장을 모두 연습한 뒤 <b>💬 대화 도전</b>으로 넘어가 보세요!";
}

function showTab(which){
  const p=which==="practice";
  $("tabPractice").classList.toggle("active",p);$("tabDialog").classList.toggle("active",!p);
  $("practice").classList.toggle("hidden",!p);$("pFooter").classList.toggle("hidden",!p);
  $("dialog").classList.toggle("hidden",p);
  if(!p)startDialog();
}

/* ---- practice render ---- */
function renderPractice(){
  const s=data.sentences[idx];
  $("bigEmoji").textContent=s.e;
  $("sentence").innerHTML=s.en.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ");
  $("ko").textContent=s.ko;
  $("stars").textContent="";$("heard").textContent="";setFB("🔊 듣기 → 🎤 말하기로 따라 말하면 다음으로 넘어가요!");
  $("replayBtn").disabled=!recordings[idx];
  $("bar").style.width=(idx/data.sentences.length*100)+"%";
  $("mascot").textContent=OWL;
  spoken=false;setNextLocked(!!SR);
}

/* ---- dialog ---- */
function startDialog(){
  dlg=data.dialog;dPos=0;$("chat").innerHTML="";
  $("doneBox").classList.add("hidden");$("dlgPrompt").classList.add("hidden");
  step();
}
function appendBubble(who,en,ko){
  const d=document.createElement("div");d.className="bubble "+(who==="npc"?"b-npc":"b-you");
  d.innerHTML=(who==="npc"?`<div class="who">🦉 부엉이</div>`:"")
    +`<div class="be">${en}</div>`+(ko?`<div class="bk">${ko}</div>`:"");
  $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;
}
function step(){
  if(dPos>=dlg.turns.length){finishDialog();return;}
  const t=dlg.turns[dPos];
  if(t.who==="npc"){
    appendBubble("npc",t.en,t.ko);dPos++;
    speak(t.en,()=>{ if(dPos<dlg.turns.length&&dlg.turns[dPos].who==="you")promptYou(); else step(); });
  } else promptYou();
}
function promptYou(){
  const t=dlg.turns[dPos];
  const line=t.model||t.en;            // 빈칸(___) 대신 완성 문장을 보여 줘 따라 읽기 쉽게
  $("myLine").textContent=line;
  $("myKo").textContent="("+t.ko+")";
  $("dlgPrompt").classList.remove("hidden");
  $("chat").scrollTop=$("chat").scrollHeight;
}
function youTurnResult(alts){
  const said=(alts&&alts[0])?alts[0]:dlg.turns[dPos].model;
  appendBubble("you",said,"");
  $("dlgPrompt").classList.add("hidden");dPos++;
  $("mascot").textContent="😄";setTimeout(()=>$("mascot").textContent=OWL,1500);
  setTimeout(step,500);
}
function finishDialog(){$("dlgPrompt").classList.add("hidden");$("doneBox").classList.remove("hidden");
  totalStars+=5;$("totalStars").textContent=totalStars;burst();$("mascot").textContent="🏆";}

/* ================= 색종이 ================= */
const cv=$("confetti"),ctx=cv.getContext("2d");
function fit(){cv.width=innerWidth;cv.height=innerHeight;}fit();addEventListener("resize",fit);
function burst(){const cols=["#ffce3d","#5ec9f5","#ff7a6b","#54d6a3","#9b7bff"];
  const parts=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.3,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,g:.35,c:cols[Math.random()*cols.length|0],s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t0=null;(function run(t){if(!t0)t0=t;const el=t-t0;ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();});
    if(el<1700)requestAnimationFrame(run);else ctx.clearRect(0,0,cv.width,cv.height);})(performance.now());}

/* ================= 이벤트 ================= */
$("listenBtn").onclick=()=>speak(data.sentences[idx].en);
$("speakBtn").onclick=()=>startListen($("speakBtn"),idx,gradePractice);
$("replayBtn").onclick=()=>{const u=recordings[idx];if(u)new Audio(u).play();};
$("nextBtn").onclick=()=>{
  if(SR && !spoken){
    setFB("먼저 🎤 말하기를 눌러 따라 말해 보세요! 🗣️");
    $("speakBtn").classList.add("nudge");
    setTimeout(()=>$("speakBtn").classList.remove("nudge"),550);
    return;
  }
  idx=(idx+1)%data.sentences.length;renderPractice();
};
$("backHome").onclick=()=>{speechSynthesis.cancel();renderHome();};
$("backList").onclick=()=>{speechSynthesis.cancel();openGrade(gradeKey);};
$("tabPractice").onclick=()=>showTab("practice");
$("tabDialog").onclick=()=>showTab("dialog");
$("dListenBtn").onclick=()=>speak(dlg.turns[dPos].model||dlg.turns[dPos].en);
$("dSpeakBtn").onclick=()=>startListen($("dSpeakBtn"),null,youTurnResult);
$("dSkipBtn").onclick=()=>youTurnResult(null);
$("restartDlg").onclick=startDialog;

renderHome();
</script>
